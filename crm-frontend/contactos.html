<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contactos</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <nav class="sidebar">
        <h2 class="logo">Tikaylab</h2>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li class="active"><a href="contactos.html">Contactos</a></li>
            <li><a href="nuevo-contacto.html">Nuevo Contacto</a></li>
        </ul>
    </nav>

    <!-- CONTENIDO -->
    <main class="content">

        <!-- HEADER -->
        <header class="topbar">
            <h1>Lista de Contactos</h1>
            <a href="nuevo-contacto.html" class="btn-primary">+ Nuevo</a>
        </header>

        <!-- PANEL TABLA -->
        <section class="panel">

            <!-- Barra de búsqueda -->
            <input type="search" placeholder="Buscar contacto..." class="search-table">

            <!-- Tabla de contactos -->
            <table class="modern-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Empresa</th>
                    </tr>
                </thead>

                <!-- Cuerpo de la tabla con datos dinámicos -->
                <tbody id="tablaContactos">
                    <!-- Los datos se cargarán aquí con JavaScript -->
                </tbody>
            </table>

        </section>

    </main>
</div>

<script src="../js/app.js"></script>
</body>
</html>
