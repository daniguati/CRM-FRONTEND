<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Dashboard</title>
    <link rel="stylesheet" href="../css/styles.css">

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <nav class="sidebar">
        <h2 class="logo">Tikaylab</h2>

        <ul>
           <li class="active" data-vista="dashboard">
  <a href="#" onclick="cargarVista('dashboard')">Dashboard</a>
</li>

<li>
  <a href="contactos.html">Contactos</a>
</li>

<li data-vista="oportunidades">
  <a href="#" onclick="cargarVista('oportunidades')">Oportunidades</a>
</li>

<li data-vista="calendario">
  <a href="#" onclick="cargarVista('calendario')">Calendario</a>
</li>

<li data-vista="reportes">
  <a href="#" onclick="cargarVista('reportes')">Reportes</a>
</li>

<li data-vista="configuracion">
  <a href="#" onclick="cargarVista('configuracion')">Configuración</a>
</li>
        </ul>
    </nav>

    <!-- CONTENIDO -->
    <main class="content">
        <div id="contenidoDinamico">

            <!-- HEADER -->
            <header class="topbar">
                <h1>Dashboard</h1>

                <div class="topbar-actions">
                    <input type="search" placeholder="Buscar..." class="search">

                    <button onclick="logout()" class="btn-logout">
                        Cerrar sesión
                    </button>
                </div>
            </header>

            <!-- CARDS -->
<section class="cards">
    <div class="card blue card-clickable" onclick="window.location.href='contactos.html'">
        <h3>Total Contactos</h3>
        <p id="totalContactosDashboard">0</p>
    </div>

    <div class="card green card-clickable" onclick="cargarVista('oportunidades')">
        <h3>Oportunidades</h3>
        <p id="totalOportunidadesDashboard">0</p>
    </div>

    <div class="card purple card-clickable" onclick="cargarVista('reportes')">
        <h3>Ventas</h3>
        <p id="ventasDashboard">$0</p>
    </div>

    <div class="card orange card-clickable" onclick="cargarVista('calendario')">
        <h3>Actividades</h3>
        <p id="actividadesDashboard">0</p>
    </div>
</section>

            <!-- GRÁFICAS -->
            <section class="panels">
                <div class="panel">
                    <h3>Ingresos Mensuales</h3>
                    <div class="fake-chart"></div>
                </div>

                <div class="panel">
                    <h3>Pipeline de Ventas</h3>
                    <div class="fake-pie"></div>
                </div>
            </section>

          <!-- LISTA -->
<section class="panel">
    <div class="panel-header-simple">
        <h3>Contactos recientes</h3>
        <a href="contactos.html" class="link-panel">Ver todos →</a>
    </div>

    <ul class="list" id="contactosRecientesDashboard">
        <li>Cargando contactos...</li>
    </ul>
</section>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/main.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
